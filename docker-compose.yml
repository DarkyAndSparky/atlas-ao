# Публикация с настоящим доменом и HTTPS-сертификатом. server.js сам
# терминирует HTTPS (см. server/certs.js) — никакого Caddy/reverse-proxy
# рядом, тот же механизм, что и в docker-compose.local.yml/start.sh, только
# тут сертификат читается ГОТОВЫМ из ATLAS_CERT_FILE/ATLAS_KEY_FILE, а не
# генерируется самоподписанным. Выпускает и продлевает сертификат внешний
# certbot (на хосте или отдельным контейнером) — server.js про ACME/Let's
# Encrypt ничего не знает, только читает PEM-файлы. Подробный порядок
# действий — в README ("Публикация с настоящим HTTPS").
#
# Порты 80/443 — стандартные снаружи (иначе certbot HTTP-01-валидация не
# сможет достучаться); внутри контейнера процесс слушает непривилегированные
# 9311/9312 (см. Dockerfile — процесс не root), Docker сам транслирует
# host-порт 80/443 в контейнерный — это нормально, привилегия нужна только
# на стороне хоста, а её берёт на себя докер-демон.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: atlas-allods:latest
    restart: unless-stopped
    # graceful shutdown (server.js слушает SIGTERM/SIGINT) обычно укладывается
    # в пару секунд, но 15с — с запасом на случай зависших keep-alive соединений
    # (сам server.js всё равно принудительно выходит через 8с, см. gracefulShutdown)
    stop_grace_period: 15s
    # Дефолтный json-file драйвер Docker без лимита размера — на реальном
    # проде stdout/stderr контейнера иначе растут неограниченно на диске
    # хоста годами. max-size — размер одного файла лога, max-file —
    # сколько таких файлов хранить (ротация, старые удаляются).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      # /app/data и не /app — базу и uploads держим отдельно от кода в именованных
      # томах, чтобы `docker compose up --build` (пересборка образа) их не задевал.
      ATLAS_DB_PATH: /app/data/atlas.db
      ATLAS_UPLOAD_DIR: /app/uploads
      ATLAS_BACKUPS_DIR: /app/backups
      # обязательно задайте свой секрет в .env — без него сервер сам сгенерирует
      # файл server/.session-secret внутри контейнера, и он потеряется при
      # пересоздании контейнера (все залогиненные сессии слетят).
      SESSION_SECRET: ${SESSION_SECRET:?Задайте SESSION_SECRET в .env — см. .env.example}
      ATLAS_HTTPS: "1"
      ATLAS_NATIVE_HTTPS: "1"
      ATLAS_HTTPS_PORT: 9311
      ATLAS_HTTP_REDIRECT_PORT: 9312
      # готовый сертификат от certbot — см. volumes ниже и README
      ATLAS_CERT_FILE: /certs/fullchain.pem
      ATLAS_KEY_FILE: /certs/privkey.pem
      # сюда certbot (режим --webroot) кладёт файлы для HTTP-01-проверки —
      # редирект-сервер (порт 9312 внутри) отдаёт их как есть, ДО редиректа
      # на HTTPS, иначе выпуск/продление сертификата никогда не пройдёт
      ATLAS_ACME_WEBROOT: /acme-webroot
      # автоматические бэкапы по расписанию — см. .env.example и server/backupScheduler.js;
      # необязательные, по умолчанию выключено (пустая ATLAS_AUTO_BACKUP != "1")
      ATLAS_AUTO_BACKUP: ${ATLAS_AUTO_BACKUP:-}
      ATLAS_AUTO_BACKUP_HOUR: ${ATLAS_AUTO_BACKUP_HOUR:-}
      ATLAS_AUTO_BACKUP_KEEP: ${ATLAS_AUTO_BACKUP_KEEP:-}
    volumes:
      - atlas-db:/app/data
      - atlas-uploads:/app/uploads
      - atlas-backups:/app/backups
      # смонтируйте сюда fullchain.pem/privkey.pem, которые выпустил certbot
      # на хосте (обычно /etc/letsencrypt/live/<домен>/) — read-only,
      # server.js их только читает, никогда не пишет
      - ${ATLAS_CERTS_HOST_DIR:-./certs}:/certs:ro
      # webroot certbot'а для HTTP-01-валидации/продления (см. комментарий выше)
      - ${ATLAS_ACME_WEBROOT_HOST_DIR:-./acme-webroot}:/acme-webroot:ro
    ports:
      - "80:9312"
      - "443:9311"
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get({hostname:'127.0.0.1',port:process.env.ATLAS_HTTPS_PORT||9311,path:'/api/health',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  atlas-db:
  atlas-uploads:
  atlas-backups:
