# Локальный запуск в Docker — HTTPS на самоподписанном сертификате, без
# домена и без Let's Encrypt. Сертификат генерирует и терминирует сам
# Node-процесс (см. server/certs.js) — никакого Caddy/reverse-proxy рядом,
# тот же самый механизм, что и у start.sh/start.bat без Docker (см. README).
# HTTP-порт тоже слушает — но только чтобы редиректнуть на HTTPS.
# Порты настраиваются через .env (см. .env.example), по умолчанию
# 9311 (HTTPS) и 9312 (HTTP-редирект).
#
# Для настоящей публикации в интернете с Let's Encrypt используйте
# docker-compose.yml — тот же механизм, но читает уже готовый сертификат
# (ATLAS_CERT_FILE/ATLAS_KEY_FILE), который снаружи выпускает и продлевает
# certbot; сюда, в локальный файл, реальный сертификат не подключается.
#
# Запуск:
#   docker compose -f docker-compose.local.yml up -d --build
# Открыть: https://localhost:9311 (или https://<IP-в-локалке>:9311, тот же
# сертификат работает и по IP — например, зайти с телефона в той же Wi-Fi).
# Браузер предупредит про самоподписанный сертификат — это ожидаемо,
# жмите «продолжить»/добавьте исключение.
# Остановка:
#   docker compose -f docker-compose.local.yml down
# (добавьте -v, если нужно ещё и стереть базу/загрузки/бэкапы/сертификат)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: atlas-allods:latest
    restart: unless-stopped
    environment:
      ATLAS_DB_PATH: /app/data/atlas.db
      ATLAS_UPLOAD_DIR: /app/uploads
      ATLAS_BACKUPS_DIR: /app/backups
      # для локальной проверки достаточно дефолта — секрет останется тем же,
      # пока не пересоздадите том atlas-db; для чего-то серьёзнее задайте
      # свой через переменную окружения SESSION_SECRET перед запуском
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-secret-change-me-1234567890}
      ATLAS_HTTPS: "1"
      ATLAS_NATIVE_HTTPS: "1"
      ATLAS_HTTPS_PORT: ${ATLAS_HTTPS_PORT:-9311}
      ATLAS_HTTP_REDIRECT_PORT: ${ATLAS_HTTP_REDIRECT_PORT:-9312}
    ports:
      - "${ATLAS_HTTPS_PORT:-9311}:${ATLAS_HTTPS_PORT:-9311}"
      - "${ATLAS_HTTP_REDIRECT_PORT:-9312}:${ATLAS_HTTP_REDIRECT_PORT:-9312}"
    volumes:
      - atlas-db:/app/data
      - atlas-uploads:/app/uploads
      - atlas-backups:/app/backups
      # сертификат кэшируется тут между перезапусками контейнера — иначе
      # каждый `up` заново генерировал бы новый, и браузер снова просил бы
      # подтверждение (см. certs.js: resolveHttpsCert кэширует на диске)
      - atlas-https-cert:/app/server/.https-cert
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get({hostname:'127.0.0.1',port:process.env.ATLAS_HTTPS_PORT||9311,path:'/api/health',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  atlas-db:
  atlas-uploads:
  atlas-backups:
  atlas-https-cert:
